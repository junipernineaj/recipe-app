<ul id="recipe-list">
    {% for recipe in recipes %}
    <li>
        <div class="recipe-info">
            <a href="/recipes/{{ recipe['id'] }}">{{ recipe["title"] }}</a>
            <span class="source">{{ recipe["source_book"] }}</span>
        </div>
        <button
            class="delete-btn"
            hx-delete="/recipes/{{ recipe['id'] }}"
            hx-target="closest li"
            hx-swap="outerHTML"
            hx-confirm="Delete '{{ recipe['title'] }}'? This can't be undone.">
            Delete
        </button>
    </li>
    {% else %}
    <li class="empty-state">No recipes found.</li>
    {% endfor %}
</ul>
