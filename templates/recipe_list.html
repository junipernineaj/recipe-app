<ul id="recipe-list">
    {% for recipe in recipes %}
    <li>
        <div class="recipe-info">
            <a href="/recipes/{{ recipe['id'] }}">{{ recipe["title"] | titlecase }}</a>
            <a href="/?book={{ recipe['source_book'] | urlencode }}" class="source" title="Show only recipes from this book">{{ recipe["source_book"] }}</a>
        </div>
        {% if is_admin %}
        <button
            class="delete-btn"
            hx-delete="/recipes/{{ recipe['id'] }}"
            hx-target="closest li"
            hx-swap="outerHTML"
            hx-confirm="Delete '{{ recipe['title'] | titlecase }}'? This can't be undone.">
            Delete
        </button>
        {% endif %}
    </li>
    {% else %}
    <li class="empty-state">No recipes found.</li>
    {% endfor %}
</ul>
