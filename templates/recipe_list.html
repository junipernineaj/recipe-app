<ul id="recipe-list">
    {% for recipe in recipes %}
    <li>
        <a href="/recipes/{{ recipe['id'] }}">{{ recipe["title"] }}</a> — <em>{{ recipe["source_book"] }}</em>
        <button
            hx-delete="/recipes/{{ recipe['id'] }}"
            hx-target="closest li"
            hx-swap="outerHTML"
            hx-confirm="Delete '{{ recipe['title'] }}'? This can't be undone.">
            Delete
        </button>
    </li>
    {% endfor %}
</ul>
