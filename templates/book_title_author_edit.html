<form
    hx-post="/books/set-title-author"
    hx-target="closest .book-title-cell"
    hx-swap="innerHTML"
    class="book-title-author-form">
    <input type="hidden" name="path" value="{{ book['path'] }}">
    <input type="text" name="title" value="{{ book['title'] or '' }}" placeholder="Title (blank = filename)">
    <input type="text" name="author" value="{{ book['author'] or '' }}" placeholder="Author">
    <button type="submit" class="btn-small">Save</button>
    <button type="button" class="btn-small btn-cancel"
            hx-get="/books/title-author-display?path={{ book['path'] | urlencode }}"
            hx-target="closest .book-title-cell"
            hx-swap="innerHTML">Cancel</button>
</form>
