<table id="books-list" class="books-table">
    <thead>
        <tr>
            <th>Filename</th>
            <th>Status</th>
            <th>Size</th>
            <th>Scanned</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book["filename"] }}</td>
            <td><span class="status-badge status-{{ book['status'] }}">{{ (book["status"] or "unknown").replace("_", " ") }}</span></td>
            <td>{{ "%.1f"|format(book["size_bytes"] / 1048576) if book["size_bytes"] else "—" }} MB</td>
            <td>{{ book["scanned_at"] or "—" }}</td>
        </tr>
        {% else %}
        <tr><td colspan="4" class="empty-state">No books found.</td></tr>
        {% endfor %}
    </tbody>
</table>
