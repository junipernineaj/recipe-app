<!DOCTYPE html>
<html>
<head>
    <title>{{ recipe["title"] }}</title>
    <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
    <div class="container">
        <a class="back-link" href="/">&larr; Back to all recipes</a>
        <div class="recipe-header">
            <h1>{{ recipe["title"] }}</h1>
            <p class="source">From: {{ recipe["source_book"] }}</p>
        </div>

        <div class="recipe-section">
            <h2>Ingredients</h2>
            <ul>
                {% for line in ingredients %}
                <li>{{ line }}</li>
                {% endfor %}
            </ul>
        </div>

        <div class="recipe-section">
            <h2>Instructions</h2>
            <ol>
                {% for line in instructions %}
                <li>{{ line }}</li>
                {% endfor %}
            </ol>
        </div>
    </div>
</body>
</html>
